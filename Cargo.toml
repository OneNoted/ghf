[package]
name = "ghf"
version = "0.1.1"
edition = "2024"
description = "Count code in GitHub repositories by language and category"
license = "MIT"
repository = "https://github.com/OneNoted/ghf"
readme = "README.md"
keywords = ["github", "loc", "cli", "tokei"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
encoding_rs_io = "0.1.8"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
globset = "0.4.20"
ignore = "0.4.33"
memchr = "2.8.3"
rayon = "1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
terminal_size = "0.4.4"
tokei = { version = "15.0.0", default-features = false }
unicode-width = "0.2.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true

